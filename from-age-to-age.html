<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Age to Age</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Karla:wght@300;400;500&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --ink:#1c1510;--ink2:#7a5525;--ink3:#b8a888;
  --gold:#c4a060;--gold2:#a07830;--gold3:#d4b870;
  --crimson:#7a3b10;--crimson2:#5a2a08;
  --cream:#ffffff;--parch:#faf5ec;--parch2:#f0ebe0;
  --bd:rgba(28,21,16,0.1);--bd2:rgba(28,21,16,0.2);
  --green:#3a6a12;--green-bg:#eaf3db;--green2:#4a8a1a;
  --red:#7a1414;--red-bg:#faeaea;--red2:#c03030;
  --blue:#0a3f7a;--blue-bg:#e4eef8;--blue2:#1560b8;
  --shadow:0 1px 4px rgba(28,21,16,0.07);
}
html,body{height:100%;font-family:'Lora',Georgia,serif;background:#fff;color:var(--ink);font-size:16px;line-height:1.7;overflow:hidden;}

/* SHELL */
.shell{display:flex;flex-direction:column;height:100vh;}

/* TOPBAR */
.topbar{flex-shrink:0;display:flex;align-items:center;gap:14px;padding:10px 22px;border-bottom:1.5px solid var(--parch2);background:#fff;z-index:10;}
.brand{font-family:'Lora',serif;font-size:17px;font-weight:600;cursor:pointer;letter-spacing:0.01em;color:var(--ink);line-height:1.1;}
.brand em{font-style:italic;font-weight:400;color:var(--gold2);}
.brand-sub{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink3);font-family:'Karla',sans-serif;margin-top:2px;}
.xp-wrap{flex:1;margin:0 12px;}
.xp-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3);margin-bottom:3px;letter-spacing:0.02em;font-family:'Karla',sans-serif;}
.xp-track{height:4px;background:var(--parch2);border-radius:2px;overflow:hidden;}
.xp-fill{height:100%;background:var(--gold);border-radius:2px;transition:width 0.6s cubic-bezier(.4,0,.2,1);}
.topbar-pills{display:flex;gap:6px;}
.pill{display:flex;align-items:center;gap:5px;font-size:11px;padding:4px 11px;border-radius:4px;background:var(--parch);border:1px solid var(--parch2);color:var(--ink2);font-family:'Karla',sans-serif;}
.pill i{font-size:13px;}
.streak{color:var(--crimson);font-weight:500;}

/* MAIN SCROLL AREA */
.main{flex:1;overflow-y:auto;overflow-x:hidden;background:#fff;}

/* SCREENS */
.screen{display:none;min-height:100%;background:#fff;}
.screen.active{display:block;}

/* ─── HOME ─── */
.home-wrap{max-width:700px;margin:0 auto;padding:36px 24px;}
.home-header{margin-bottom:28px;padding-bottom:24px;border-bottom:1.5px solid var(--parch2);}
.home-header h1{font-family:'Lora',serif;font-size:32px;font-weight:600;line-height:1.15;margin-bottom:8px;color:var(--ink);}
.home-header h1 em{font-style:italic;font-weight:400;color:var(--gold2);}
.home-header p{font-size:14px;color:var(--ink3);max-width:480px;font-family:'Karla',sans-serif;font-weight:400;line-height:1.6;}
.section-eyebrow{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:14px;font-family:'Karla',sans-serif;}
.track-card{border:1px solid var(--parch2);border-radius:8px;overflow:hidden;cursor:pointer;transition:border-color 0.2s,box-shadow 0.15s;background:#fff;margin-bottom:10px;box-shadow:var(--shadow);}
.track-card:hover:not(.locked){border-color:var(--bd2);box-shadow:0 3px 12px rgba(28,21,16,0.1);}
.track-card.locked{opacity:0.42;cursor:not-allowed;}
.tc-body{padding:16px 18px 12px;display:flex;align-items:flex-start;gap:14px;}
.tc-icon{width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;background:var(--parch);color:var(--gold);}
.tc-icon.complete{background:var(--green-bg);color:var(--green2);}
.tc-text{flex:1;}
.tc-name{font-family:'Lora',serif;font-size:16px;font-weight:600;margin-bottom:3px;color:var(--ink);}
.tc-desc{font-size:12px;color:var(--ink3);line-height:1.5;font-family:'Karla',sans-serif;}
.tc-pills{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
.tc-pill{font-size:9px;padding:2px 8px;border-radius:3px;background:var(--parch);color:var(--ink3);font-family:'Karla',sans-serif;letter-spacing:0.04em;}
.tc-footer{display:flex;align-items:center;justify-content:space-between;padding:7px 18px;border-top:1px solid var(--parch2);font-size:10px;color:var(--ink3);font-family:'Karla',sans-serif;}
.tc-progress-track{flex:1;height:2px;background:var(--parch2);border-radius:1px;margin:0 12px;overflow:hidden;}
.tc-progress-fill{height:100%;border-radius:1px;background:var(--gold);transition:width 0.5s;}
.tc-progress-fill.done{background:var(--green2);}
.tc-badge{font-size:9px;padding:2px 9px;border-radius:3px;font-weight:500;font-family:'Karla',sans-serif;letter-spacing:0.04em;}
.badge-new{background:var(--blue-bg);color:var(--blue2);}
.badge-progress{background:var(--parch);color:var(--gold2);}
.badge-done{background:var(--green-bg);color:var(--green2);}
.badge-locked{background:var(--parch2);color:var(--ink3);}

/* ─── TRACK DETAIL ─── */
.detail-wrap{max-width:700px;margin:0 auto;padding:28px 24px;background:#fff;}
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink3);cursor:pointer;margin-bottom:20px;padding:6px 0;transition:color 0.15s;font-family:'Karla',sans-serif;letter-spacing:0.02em;}
.back-btn:hover{color:var(--ink);}
.detail-header{padding-bottom:18px;border-bottom:1.5px solid var(--parch2);margin-bottom:22px;}
.detail-eyebrow{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:6px;font-family:'Karla',sans-serif;}
.detail-header h2{font-family:'Lora',serif;font-size:26px;font-weight:600;margin-bottom:6px;color:var(--ink);}
.detail-header p{font-size:13px;color:var(--ink3);font-family:'Karla',sans-serif;line-height:1.6;}
.lessons-label{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold);margin-bottom:12px;font-family:'Karla',sans-serif;}
.lesson-row{display:flex;align-items:center;gap:14px;padding:13px 16px;border:1px solid var(--parch2);border-radius:6px;cursor:pointer;transition:all 0.15s;background:#fff;margin-bottom:7px;box-shadow:var(--shadow);}
.lesson-row:hover:not(.locked){border-color:var(--bd2);background:var(--parch);}
.lesson-row.locked{opacity:0.42;cursor:not-allowed;}
.lesson-row.complete{border-color:#b0d880;}
.lesson-num{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex-shrink:0;background:var(--parch);color:var(--ink3);font-family:'Karla',sans-serif;}
.lesson-num.complete{background:var(--green-bg);color:var(--green2);}
.lesson-num.active{background:var(--gold);color:#fff;}
.lesson-info{flex:1;}
.lesson-name{font-size:15px;font-weight:400;margin-bottom:2px;font-family:'Lora',serif;color:var(--ink);}
.lesson-meta{font-size:11px;color:var(--ink3);font-family:'Karla',sans-serif;}
.lesson-right{display:flex;align-items:center;gap:8px;}
.lesson-stars{display:flex;gap:3px;}
.lesson-star{font-size:13px;color:var(--parch2);}
.lesson-star.lit{color:var(--gold);}
.lesson-lock{font-size:16px;color:var(--ink3);}

/* ─── TIMELINE LESSON LIST ─── */
.tl-list{position:relative;}
.tl-spine{position:absolute;left:15px;top:6px;bottom:28px;width:1.5px;background:var(--parch2);z-index:0;}
.tl-group{position:relative;margin-bottom:2px;}
.tl-era-row{display:flex;align-items:center;gap:10px;padding:22px 0 10px;position:relative;z-index:1;}
.tl-group:first-child .tl-era-row{padding-top:2px;}
.tl-node{width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--parch2);flex-shrink:0;margin-left:9px;z-index:1;position:relative;transition:border-color 0.2s,background 0.2s;}
.tl-node.upcoming{border-color:var(--gold3);}
.tl-node.active{border-color:var(--gold);}
.tl-node.done{background:var(--gold);border-color:var(--gold);}
.tl-era-label{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ink3);font-family:'Karla',sans-serif;}
.tl-cards{padding-left:30px;display:flex;flex-direction:column;gap:5px;margin-bottom:4px;}

/* Essay card */
.tl-essay{background:var(--parch);border:1px solid var(--parch2);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:11px;}
.tl-essay:hover:not(.locked){border-color:var(--gold3);background:#f5efe2;}
.tl-essay.locked{opacity:0.38;cursor:not-allowed;}
.tl-essay.done{border-color:#d4c898;}
.tl-e-icon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:rgba(196,160,96,0.15);color:var(--gold2);}
.tl-e-icon.done{background:var(--green-bg);color:var(--green2);}
.tl-e-info{flex:1;min-width:0;}
.tl-e-type{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--gold2);font-family:'Karla',sans-serif;margin-bottom:1px;}
.tl-e-name{font-family:'Lora',serif;font-size:14px;color:var(--ink);line-height:1.3;}
.tl-e-meta{font-size:10px;color:var(--ink3);font-family:'Karla',sans-serif;margin-top:2px;}

/* Quiz card */
.tl-quiz{background:#fff;border:1px solid var(--parch2);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all 0.15s;display:flex;align-items:center;gap:11px;box-shadow:0 1px 3px rgba(28,21,16,0.06);}
.tl-quiz:hover:not(.locked){border-color:var(--bd2);}
.tl-quiz.locked{opacity:0.38;cursor:not-allowed;}
.tl-quiz.complete{border-color:#b0d880;}
.tl-q-icon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:var(--parch);color:var(--ink3);}
.tl-q-icon.active{background:var(--crimson);color:#fff;}
.tl-q-icon.complete{background:var(--green-bg);color:var(--green2);}
.tl-q-info{flex:1;min-width:0;}
.tl-q-type{font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);font-family:'Karla',sans-serif;margin-bottom:1px;}
.tl-q-name{font-family:'Lora',serif;font-size:14px;color:var(--ink);line-height:1.3;}
.tl-q-meta{font-size:10px;color:var(--ink3);font-family:'Karla',sans-serif;margin-top:2px;}
.tl-q-right{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.tl-stars{display:flex;gap:2px;}
.tl-star{font-size:11px;color:var(--parch2);}
.tl-star.lit{color:var(--gold);}

/* ─── ARTICLE ─── */
.article-wrap{max-width:660px;margin:0 auto;padding:28px 24px;background:#fff;}
.read-bar{height:2px;background:var(--parch2);position:sticky;top:0;z-index:5;}
.read-bar-fill{height:100%;background:var(--gold);transition:width 0.2s;}
.article-eyebrow{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
.art-tag{font-size:9px;padding:3px 10px;border-radius:3px;background:var(--parch);color:var(--gold2);font-family:'Karla',sans-serif;letter-spacing:0.08em;text-transform:uppercase;border:1px solid var(--parch2);}
.art-time{font-size:11px;color:var(--ink3);display:flex;align-items:center;gap:4px;font-family:'Karla',sans-serif;}
.article-title{font-family:'Lora',serif;font-size:32px;font-weight:600;line-height:1.15;margin-bottom:10px;color:var(--ink);}
.article-sub{font-size:16px;color:var(--ink3);font-style:italic;margin-bottom:24px;line-height:1.6;font-family:'Lora',serif;font-weight:400;}
.art-divider{width:36px;height:1.5px;background:var(--gold);margin-bottom:28px;}
.article-body h3{font-family:'Lora',serif;font-size:20px;font-weight:600;margin:2rem 0 0.75rem;color:var(--ink);}
.article-body p{margin-bottom:1.1rem;font-size:15.5px;line-height:1.85;color:var(--ink);font-family:'Lora',serif;font-weight:400;}
.article-body strong{color:var(--crimson);font-weight:600;}
.pull-quote{border-left:2px solid var(--gold);padding:12px 20px;margin:1.5rem 0;background:var(--parch);}
.pull-quote p{font-style:italic;font-size:16px;color:var(--ink2);margin:0;font-family:'Lora',serif;}
.pull-quote cite{font-size:11px;color:var(--ink3);display:block;margin-top:6px;font-family:'Karla',sans-serif;}
.atl-box{border:1px solid var(--parch2);border-radius:6px;padding:14px 16px;margin:1.5rem 0;background:#fff;}
.atl-label{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:10px;font-family:'Karla',sans-serif;}
.atl-row{display:flex;gap:12px;margin-bottom:7px;font-size:12px;font-family:'Karla',sans-serif;}
.atl-year{color:var(--gold2);font-weight:500;min-width:54px;flex-shrink:0;}
.atl-text{color:var(--ink3);}
.article-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--parch2);}

/* ── ARTICLE FIGURES — improved ── */
.art-fig{margin:1.75rem 0;border:1px solid var(--parch2);border-radius:8px;overflow:hidden;background:var(--parch);}

/* Full-width image figure */
.art-fig .fig-img-wrap{
  position:relative;
  width:100%;
  background:var(--parch2);
  min-height:200px;
  overflow:hidden;
}
.art-fig .fig-img-wrap img{
  width:100%;
  display:block;
  object-fit:cover;
  max-height:360px;
  position:relative;
  z-index:1;
}
/* Skeleton shimmer while loading */
.art-fig .fig-img-wrap::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,var(--parch2) 25%,var(--parch) 50%,var(--parch2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.6s infinite;
  z-index:0;
}
.art-fig .fig-img-wrap img.error-hide{display:none;}
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* Portrait layout */
.art-fig.portrait{display:flex;align-items:stretch;}
.art-fig.portrait .fig-img-wrap{
  width:200px;
  min-width:200px;
  flex-shrink:0;
  min-height:260px;
  max-height:none;
}
.art-fig.portrait .fig-img-wrap img{
  width:100%;
  height:100%;
  max-height:none;
  object-fit:cover;
  object-position:top center;
}
.art-fig.portrait .fig-body{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  padding:20px 22px;
  border-left:1px solid var(--parch2);
}

figcaption,.fig-caption-text{
  padding:10px 16px;
  font-size:11px;
  color:var(--ink3);
  font-family:'Karla',sans-serif;
  border-top:1px solid var(--parch2);
  line-height:1.6;
  background:#fff;
}
figcaption strong{color:var(--ink2);font-weight:500;}
.art-fig.portrait figcaption{display:none;} /* caption is inside fig-body for portrait */

.fig-label{font-size:9px;letter-spacing:0.13em;text-transform:uppercase;color:var(--gold);font-family:'Karla',sans-serif;margin-bottom:5px;}
.fig-title{font-family:'Lora',serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:8px;line-height:1.3;}
.fig-desc{font-size:12px;color:var(--ink3);font-family:'Karla',sans-serif;line-height:1.6;}

/* Map figure — Leaflet */
.art-map{margin:1.75rem 0;border:1px solid var(--parch2);border-radius:8px;overflow:hidden;}
.art-map .map-container{height:340px;width:100%;}
.art-map figcaption{padding:10px 16px;font-size:11px;color:var(--ink3);font-family:'Karla',sans-serif;border-top:1px solid var(--parch2);background:#fff;line-height:1.6;}
.art-map figcaption strong{color:var(--ink2);font-weight:500;}

/* Paul's journey — image replacement */
.art-fig-journey{
  margin:1.75rem 0;
  border:1px solid var(--parch2);
  border-radius:8px;
  overflow:hidden;
  background:var(--parch);
}
.art-fig-journey .fig-img-wrap{
  position:relative;
  width:100%;
  background:var(--parch2);
  min-height:240px;
  overflow:hidden;
}
.art-fig-journey .fig-img-wrap::before{
  content:'';
  position:absolute;inset:0;
  background:linear-gradient(90deg,var(--parch2) 25%,var(--parch) 50%,var(--parch2) 75%);
  background-size:200% 100%;
  animation:shimmer 1.6s infinite;
  z-index:0;
}
.art-fig-journey .fig-img-wrap img{
  width:100%;
  display:block;
  object-fit:contain;
  max-height:420px;
  background:var(--parch);
  position:relative;
  z-index:1;
  transition:opacity 0.4s;
}
.art-fig-journey figcaption{
  padding:10px 16px;
  font-size:11px;
  color:var(--ink3);
  font-family:'Karla',sans-serif;
  border-top:1px solid var(--parch2);
  background:#fff;
  line-height:1.6;
}
.art-fig-journey figcaption strong{color:var(--ink2);font-weight:500;}

/* ─── LESSON / QUESTION ─── */
.lesson-wrap{max-width:640px;margin:0 auto;padding:24px;background:#fff;}

/* lives bar */
.lives-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
.lives-display{display:flex;gap:6px;}
.heart{font-size:22px;transition:all 0.3s;}
.heart.full{color:var(--crimson);}
.heart.empty{color:var(--parch2);}
.heart.lost{animation:heartbreak 0.4s ease forwards;}
@keyframes heartbreak{0%{transform:scale(1.3);}50%{transform:scale(0.7);opacity:0.5;}100%{transform:scale(1);opacity:1;color:var(--parch2);}}
.lesson-prog-wrap{display:flex;align-items:center;gap:10px;flex:1;margin-left:16px;}
.lesson-prog-track{flex:1;height:4px;background:var(--parch2);border-radius:2px;overflow:hidden;}
.lesson-prog-fill{height:100%;background:var(--green2);border-radius:2px;transition:width 0.4s;}
.lesson-prog-label{font-size:11px;color:var(--ink3);white-space:nowrap;font-family:'Karla',sans-serif;}

/* question card */
.q-card{border:1px solid var(--parch2);border-radius:8px;overflow:hidden;margin-bottom:16px;background:#fff;box-shadow:var(--shadow);}
.q-card-header{padding:9px 16px;border-bottom:1px solid var(--parch2);background:var(--parch);display:flex;align-items:center;justify-content:space-between;}
.q-era{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);font-family:'Karla',sans-serif;}
.q-type-badge{font-size:9px;padding:2px 8px;border-radius:3px;background:#fff;color:var(--ink3);font-family:'Karla',sans-serif;border:1px solid var(--parch2);}
.q-body{padding:20px 18px;}
.q-text{font-family:'Lora',serif;font-size:19px;line-height:1.4;color:var(--ink);font-weight:400;}

/* options */
.options{display:flex;flex-direction:column;gap:8px;margin-top:1rem;}
.opt{padding:12px 15px;border:1px solid var(--parch2);border-radius:6px;background:#fff;color:var(--ink);font-family:'Lora',serif;font-size:14px;text-align:left;cursor:pointer;transition:all 0.15s;line-height:1.5;display:flex;align-items:center;gap:12px;}
.opt-letter{width:24px;height:24px;border-radius:3px;background:var(--parch);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500;flex-shrink:0;transition:all 0.15s;font-family:'Karla',sans-serif;color:var(--ink3);}
.opt:hover:not(.answered){border-color:var(--gold);background:var(--parch);}
.opt:hover:not(.answered) .opt-letter{background:var(--gold);color:#fff;}
.opt.correct{background:var(--green-bg);border-color:#b0d880;color:var(--green);}
.opt.correct .opt-letter{background:var(--green2);color:#fff;}
.opt.wrong{background:var(--red-bg);border-color:#e8a0a0;color:var(--red);}
.opt.wrong .opt-letter{background:var(--red2);color:#fff;}
.opt.tl-done{background:var(--green-bg);border-color:#b0d880;color:var(--green);cursor:default;pointer-events:none;}
.opt.tl-done .opt-letter{background:var(--green2);color:#fff;}

/* tf options */
.tf-row{display:flex;gap:10px;margin-top:1rem;}
.tf-btn{flex:1;padding:18px;border:1px solid var(--parch2);border-radius:6px;background:#fff;color:var(--ink);font-family:'Lora',serif;font-size:18px;cursor:pointer;transition:all 0.15s;text-align:center;}
.tf-btn:hover:not(.answered){background:var(--parch);border-color:var(--gold);}
.tf-btn.correct{background:var(--green-bg);border-color:#b0d880;color:var(--green);}
.tf-btn.wrong{background:var(--red-bg);border-color:#e8a0a0;color:var(--red);}
.tf-icon{display:block;font-size:26px;margin-bottom:6px;}
.tf-label{font-size:14px;font-family:'Karla',sans-serif;}

/* feedback */
.q-feedback{padding:11px 15px;border-radius:6px;font-size:13px;line-height:1.6;margin-bottom:14px;display:none;font-family:'Karla',sans-serif;}
.q-feedback.show.correct{display:block;background:var(--green-bg);color:var(--green);border:1px solid #b0d880;}
.q-feedback.show.wrong{display:block;background:var(--red-bg);color:var(--red);border:1px solid #e8a0a0;}

/* shake animation for wrong */
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-8px);}40%{transform:translateX(8px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.shake{animation:shake 0.4s ease;}

/* continue btn */
.continue-btn{width:100%;padding:13px;background:var(--green2);color:#fff;border:none;border-radius:6px;font-family:'Karla',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:background 0.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;letter-spacing:0.02em;}
.continue-btn:hover{background:var(--green);}

/* RESULT SCREENS */
.result-screen{max-width:480px;margin:0 auto;padding:3rem 24px;text-align:center;}
.result-icon{font-size:48px;margin-bottom:1rem;}
.result-icon.gold{color:var(--gold);}
.result-icon.green{color:var(--green2);}
.result-icon.red{color:var(--red2);}
.result-title{font-family:'Lora',serif;font-size:26px;font-weight:600;margin-bottom:8px;}
.result-sub{font-size:13px;color:var(--ink3);margin-bottom:1.5rem;line-height:1.6;font-family:'Karla',sans-serif;}
.result-stats{display:flex;gap:8px;justify-content:center;margin-bottom:1.5rem;flex-wrap:wrap;}
.rst{text-align:center;padding:14px 20px;background:#fff;border-radius:6px;border:1px solid var(--parch2);}
.rst .n{font-family:'Lora',serif;font-size:28px;font-weight:600;color:var(--ink);}
.rst .l{font-size:10px;color:var(--ink3);margin-top:2px;font-family:'Karla',sans-serif;letter-spacing:0.04em;text-transform:uppercase;}
.result-btns{display:flex;flex-direction:column;gap:8px;max-width:280px;margin:0 auto;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:6px;border:1px solid var(--parch2);background:#fff;color:var(--ink);font-family:'Karla',sans-serif;font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;letter-spacing:0.01em;}
.btn:hover{background:var(--parch);}
.btn-primary{background:var(--crimson);color:#fff;border-color:var(--crimson);}
.btn-primary:hover{background:var(--crimson2);border-color:var(--crimson2);}
.btn-gold{background:var(--gold2);color:#fff;border-color:var(--gold2);}
.btn-gold:hover{background:var(--gold);}
.btn-full{width:100%;padding:13px;font-size:15px;border-radius:6px;}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 20px;border-radius:4px;font-size:12px;font-family:'Karla',sans-serif;opacity:0;transition:opacity 0.3s;pointer-events:none;z-index:200;white-space:nowrap;letter-spacing:0.02em;}
.toast.show{opacity:1;}

/* XP POP */
.xp-pop{position:fixed;font-size:14px;font-weight:500;color:var(--gold2);pointer-events:none;z-index:300;opacity:0;font-family:'Lora',serif;}
@keyframes floatup{0%{opacity:1;transform:translateY(0);}100%{opacity:0;transform:translateY(-50px);}}

/* ─── EXAM ─── */
.exam-seal-bar{background:linear-gradient(135deg,var(--crimson2) 0%,var(--crimson) 100%);padding:18px 24px;margin:-24px -24px 24px;text-align:center;}
.exam-seal-bar .exam-eyebrow{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.7);font-family:'Karla',sans-serif;margin-bottom:4px;}
.exam-seal-bar .exam-title{font-family:'Lora',serif;font-size:20px;font-weight:600;color:#fff;}
.exam-seal-bar .exam-prog{font-size:11px;color:rgba(255,255,255,0.6);font-family:'Karla',sans-serif;margin-top:4px;}
.exam-cta{margin-top:18px;padding:20px;border:1px solid var(--parch2);border-radius:8px;background:var(--parch);text-align:center;}
.exam-cta-eyebrow{font-size:9px;letter-spacing:0.16em;text-transform:uppercase;color:var(--gold2);font-family:'Karla',sans-serif;margin-bottom:8px;}
.exam-cta p{font-size:13px;color:var(--ink3);font-family:'Karla',sans-serif;line-height:1.6;margin-bottom:14px;}
.wax-seal{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:20px;background:var(--crimson);color:#fff;font-size:10px;font-family:'Karla',sans-serif;font-weight:500;letter-spacing:0.04em;}
.wax-seal i{font-size:12px;}

<script>
// ═══════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════
function loadState(){
  try{const s=localStorage.getItem('fromagetoage_v1');if(s)return JSON.parse(s);}catch(e){}
  return{xp:0,level:1,streak:0,lastStudied:null,tracks:{track1:{lessons:{l1:0,l2:0,l3:0,l4:0}}}};
}
let S=loadState();
function save(){try{localStorage.setItem('fromagetoage_v1',JSON.stringify(S));}catch(e){}}
function today(){return new Date().toDateString();}

// XP & level
const XP_THRESHOLDS=[0,50,150,300,500,800,1200,1800,2600,3600];
const LEVEL_TITLES=['Catechumen','Acolyte','Lector','Confessor','Apologist','Deacon','Scholar','Bishop','Doctor','Doctor Ecclesiae'];
function addXP(amt,x,y){
  S.xp+=amt;
  for(let i=XP_THRESHOLDS.length-1;i>=0;i--){if(S.xp>=XP_THRESHOLDS[i]){S.level=i+1;break;}}
  save();
  updateTopbar();
  if(x!==undefined)floatXP('+'+amt+' XP',x,y);
}
function updateTopbar(){
  const lv=S.level;
  const curr=XP_THRESHOLDS[lv-1]||0;
  const next=XP_THRESHOLDS[lv]||9999;
  const pct=Math.min(100,Math.round((S.xp-curr)/(next-curr)*100));
  document.getElementById('lvl-label').textContent='Level '+lv+' · '+LEVEL_TITLES[Math.min(lv,10)-1];
  document.getElementById('xp-next-label').textContent=(next-S.xp)+' XP to next level';
  document.getElementById('xp-fill').style.width=pct+'%';
  document.getElementById('streak-disp').textContent=S.streak;
  document.getElementById('total-xp-disp').textContent=S.xp;
}
function floatXP(txt,x,y){
  const el=document.createElement('div');
  el.className='xp-pop';
  el.textContent=txt;
  el.style.left=x+'px';el.style.top=y+'px';
  document.body.appendChild(el);
  el.style.animation='floatup 1.2s ease forwards';
  setTimeout(()=>el.remove(),1300);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),1800);
}

  {

];

function L1_QUESTIONS(){return[
  {type:'mc',era:'Early Church',q:'On what Jewish feast day did the Holy Spirit fall and the church begin?',correct:'Pentecost',wrong:['Passover','Tabernacles','Purim','First Fruits','Day of Atonement','Unleavened Bread','Rosh Hashanah'],explain:'Pentecost — fifty days after Passover — was the day the Spirit fell and Peter preached, with 3,000 baptized.'},
  {type:'tf',era:'Early Church',q:'The Apostle Paul wrote his letters AFTER the four Gospels were composed.',answer:false,explain:'Paul\'s letters (written in the 50s AD) are actually the oldest surviving Christian documents — the Gospels came later.'},
  {type:'mc',era:'Early Church',q:'Why did Rome consider Christians politically dangerous?',correct:'They refused to offer incense to the emperor\'s image',wrong:['They held secret underground meetings','They paid no taxes to Rome','They spoke in unknown tongues publicly','They claimed a king higher than Caesar','They refused to serve in the Roman army','They destroyed pagan temples','They banned Roman citizens from their gatherings'],explain:'Refusing to honor the emperor\'s image was read as treason. Christians saw it as idolatry; Rome saw it as civic disloyalty.'},
  {type:'tf',era:'Early Church',q:'Polycarp of Smyrna was a disciple of the Apostle John.',answer:true,explain:'Polycarp was indeed a disciple of John and served as Bishop of Smyrna until his martyrdom around AD 155 at age 86.'},
  {type:'mc',era:'Early Church',q:'Tertullian of Carthage is credited with coining which Latin theological term?',correct:'Trinitas',wrong:['Ecclesia','Salvatio','Gratia','Incarnatio','Peccatum','Fides','Sola'],explain:'Tertullian coined "Trinitas" (Trinity) and the formula "one substance, three persons" — foundational to all Western theology.'},
  {type:'mc',era:'Early Church',q:'Which emperor issued the Edict of Milan (313 AD) that legalized Christianity?',correct:'Constantine',wrong:['Nero','Diocletian','Theodosius','Trajan','Marcus Aurelius','Hadrian','Commodus'],explain:'Constantine issued the Edict of Milan in 313, ending persecution and beginning Christianity\'s transformation into an imperial religion.'},
  {type:'tf',era:'Early Church',q:'The Neronian persecution began because Nero blamed Christians for the Great Fire of Rome.',answer:true,explain:'In 64 AD, Nero used Christians as scapegoats for the Great Fire, executing them with theatrical cruelty — burned, crucified, thrown to beasts.'},
  {type:'mc',era:'Early Church',q:'What did Ignatius of Antioch write while being transported to Rome for execution?',correct:'Seven letters to churches',wrong:['A commentary on the Psalms','The first Christian creed','A defense of Christianity to Emperor Trajan','A history of the apostles','A manual on church discipline','A theological treatise on baptism','A letter to the Bishop of Rome alone'],explain:'Ignatius wrote seven letters to churches along his route to martyrdom — some of the earliest evidence of episcopal church structure.'},
  {type:'mc',era:'Early Church',q:'Approximately how many people were baptized after Peter\'s sermon on the day of Pentecost?',correct:'Three thousand',wrong:['Five hundred','One thousand','Five thousand','Ten thousand','Two hundred','Seventy','Twelve hundred'],explain:'Acts 2:41 records that about three thousand people were added to the church that day after Peter\'s Pentecost sermon.'},
  {type:'tf',era:'Early Church',q:'The early church thinkers known as "Apologists" argued that Christianity was philosophically serious and Christians were loyal citizens.',answer:true,explain:'Justin Martyr, Tertullian, Origen and others wrote sophisticated defenses to Roman emperors and intellectuals making exactly these arguments.'},
  {type:'mc',era:'Early Church',q:'What was Tertullian\'s famous claim about the relationship between martyrdom and church growth?',correct:'The blood of the martyrs is the seed of the church',wrong:['The church grows stronger through suffering alone','Martyrs unlock the gates of heaven for all believers','Death in Christ is the highest form of baptism','The empire cannot outlast the church it persecutes','Rome will fall before the church does','Persecution purifies the church of false believers','Every martyr produces a hundred new converts'],explain:'Tertullian\'s famous line summarized how persecution paradoxically expanded Christianity rather than destroying it.'},
  {type:'mc',era:'Early Church',q:'Paul\'s letters are significant in church history because they are:',correct:'The oldest surviving Christian documents, predating the Gospels',wrong:['The first writings to mention Jesus by name','Written after the Council of Jerusalem settled all disputes','The only source we have for Paul\'s theology','Written in Hebrew and later translated to Greek','Composed collectively by a group of apostles','The first documents to use the word "Christian"','Dictated by Peter and attributed to Paul'],explain:'Paul\'s letters, written in the 50s AD, predate the Gospels — making them the earliest surviving Christian writings we have.'},
  {type:'tf',era:'Early Church',q:'Christians were accused by Romans of cannibalism, partly due to misunderstandings about the Eucharist.',answer:true,explain:'Rumors about eating flesh and drinking blood at secret gatherings led some Romans to accuse Christians of cannibalism — a serious misreading of Eucharistic language.'},
  {type:'mc',era:'Early Church',q:'Where did the church first begin, according to the book of Acts?',correct:'Jerusalem',wrong:['Antioch','Rome','Ephesus','Corinth','Bethlehem','Alexandria','Athens'],explain:'The church was born in Jerusalem on the day of Pentecost, though it spread quickly — Antioch later became the first great Gentile center.'},
  {type:'tf',era:'Early Church',q:'The Apostle John was martyred by beheading in Rome, like Peter and Paul.',answer:false,explain:'John is the only apostle traditionally believed to have died of old age, not martyrdom — exiled to Patmos under Domitian, where he wrote Revelation.'},
  {type:'mc',era:'Early Church',q:'Which Roman emperor first made Christianity the official state religion of the Roman Empire?',correct:'Theodosius I',wrong:['Constantine','Nero','Julian','Diocletian','Hadrian','Augustus','Valerian'],explain:'While Constantine legalized Christianity in 313, it was Theodosius I who made it the official state religion in 380 AD with the Edict of Thessalonica.'},
  {type:'quote',era:'Early Church',quote:'“Eighty-six years I have served him, and he has done me no wrong. How can I blaspheme my King who saved me?”',cite:'— Before his martyrdom, c. AD 155',q:'Who said this shortly before being burned alive?',correct:'Polycarp of Smyrna',wrong:['Ignatius of Antioch','Justin Martyr','Tertullian of Carthage','Origen of Alexandria','Clement of Rome','Cyprian of Carthage','Irenaeus of Lyon'],explain:'Polycarp, bishop of Smyrna and disciple of the Apostle John, refused to deny Christ before his Roman executioners at age 86.'},
  {type:'quote',era:'Early Church',quote:'“The blood of the martyrs is the seed of the church.”',cite:'— Apologeticus, c. AD 197',q:'Who wrote this famous line about Christian persecution?',correct:'Tertullian of Carthage',wrong:['Polycarp of Smyrna','Justin Martyr','Origen of Alexandria','Clement of Rome','Ignatius of Antioch','Cyprian of Carthage','Irenaeus of Lyon'],explain:'Tertullian argued that persecution paradoxically strengthened the church — each martyrdom drew more converts than it silenced.'},
  {type:'timeline',era:'Early Church',q:'Tap these events in chronological order, earliest first.',events:[{label:'Pentecost — the church begins in Jerusalem',year:30},{label:'Paul\'s first missionary journey',year:46},{label:'Nero blames Christians for the Great Fire',year:64},{label:'Romans destroy Jerusalem and the Temple',year:70},{label:'John writes Revelation from Patmos',year:95}],explain:'Pentecost (c. 30) → Paul\'s first journey (c. 46–48) → Neronian persecution (64) → Jerusalem destroyed (70) → Revelation written (c. 95).'},
  {type:'timeline',era:'Early Church',q:'Tap these events in chronological order, earliest first.',events:[{label:'Nero blames Christians for the Great Fire',year:64},{label:'Polycarp martyred at Smyrna',year:155},{label:'Tertullian coins the term Trinity',year:200},{label:'Edict of Milan legalizes Christianity',year:313},{label:'First Council of Nicaea',year:325}],explain:'Great Fire blamed on Christians (64) → Polycarp\'s martyrdom (c. 155) → Tertullian\'s Trinitas (c. 200) → Edict of Milan (313) → Nicaea (325).'},
]}

function L2_QUESTIONS(){return[
  {type:'mc',era:'Councils',q:'What was the central claim of Arius that the Council of Nicaea condemned?',correct:'The Son was a created being and not eternal',wrong:['The Holy Spirit does not proceed from the Father','Christ had no true human nature','Baptism is unnecessary for salvation','Mary should not be called the Mother of God','The Bible alone is sufficient for salvation','There is no resurrection of the body','The church has no authority to define doctrine'],explain:'Arius taught "there was a time when he was not" — the Son was a created being. Nicaea condemned this and affirmed the Son is homoousios with the Father.'},
  {type:'tf',era:'Councils',q:'The word "homoousios" means "of similar substance," implying the Son is like but not identical to the Father.',answer:false,explain:'Homoousios means "of one substance" — identical, not merely similar. The "similar" word was homoiousios, differing by a single Greek letter (iota).'},
  {type:'mc',era:'Councils',q:'Roughly how many bishops attended the First Council of Nicaea in 325 AD?',correct:'About 300',wrong:['About 50','About 1,000','All 1,800 bishops in the empire','About 12','About 700','About 2,000','About 100'],explain:'About 300 bishops attended — mostly Eastern. Of roughly 1,800 bishops in the empire, the Western church sent only two presbyters as delegates.'},
  {type:'tf',era:'Councils',q:'The Council of Constantinople (381) completed the Nicene Creed as we know it today.',answer:true,explain:'While drafted at Nicaea (325), the creed was finalized at Constantinople (381) — adding the full affirmation of the Holy Spirit\'s divinity.'},
  {type:'mc',era:'Councils',q:'The Council of Chalcedon (451) defined that Christ has:',correct:'Two complete natures — divine and human — in one person',wrong:['One divine nature only, with no true humanity','A single nature blending divine and human','Two separate persons united in purpose','A human body with a divine soul only','Three natures reflecting the Trinity','One person with alternating natures','A divine nature that absorbed his humanity'],explain:'Chalcedon defined the "hypostatic union" — Christ is fully divine and fully human, two complete natures in one person without mixture or confusion.'},
  {type:'mc',era:'Patristics',q:'Which church father wrote "Our heart is restless until it rests in Thee"?',correct:'Augustine of Hippo',wrong:['Origen of Alexandria','Jerome of Bethlehem','Ambrose of Milan','John Chrysostom','Basil of Caesarea','Gregory of Nazianzus','Tertullian of Carthage'],explain:'Augustine wrote this in the opening of his Confessions (c. 400 AD) — one of the most quoted lines in all of Christian literature.'},
  {type:'tf',era:'Patristics',q:'Athanasius was exiled from Alexandria multiple times for defending Nicene orthodoxy.',answer:true,explain:'Athanasius was exiled five times — hence "Athanasius contra mundum" (Athanasius against the world). He outlasted every emperor who opposed him.'},
  {type:'mc',era:'Patristics',q:'The three Cappadocian Fathers who shaped Trinitarian theology were:',correct:'Basil of Caesarea, Gregory of Nyssa, and Gregory of Nazianzus',wrong:['Augustine, Jerome, and Ambrose','Origen, Clement, and Tertullian','Polycarp, Ignatius, and Irenaeus','John Chrysostom, Cyril, and Athanasius','Justin Martyr, Tertullian, and Origen','Anselm, Aquinas, and Bonaventure','Peter, James, and John'],explain:'The Cappadocians formalized "one ousia, three hypostaseis" — one substance, three persons — the grammar of Trinitarian orthodoxy.'},
  {type:'mc',era:'Councils',q:'Who convened the First Council of Nicaea, and why?',correct:'Emperor Constantine, to resolve the Arian controversy',wrong:['Pope Sylvester I, to define the biblical canon','Bishop Alexander of Alexandria, to condemn Gnosticism','Emperor Diocletian, to organize the church','The Apostle Peter\'s successor, to unify the East and West','Emperor Theodosius, to enforce Christian worship','The Bishop of Antioch, to address baptism disputes','Emperor Trajan, to distinguish Christianity from Judaism'],explain:'Constantine convened Nicaea in 325 primarily to resolve the crisis caused by Arius\'s teaching — a theological dispute threatening imperial unity.'},
  {type:'tf',era:'Patristics',q:'The phrase "Athanasius contra mundum" means "Athanasius against the world."',answer:true,explain:'The Latin phrase captures Athanasius\'s willingness to stand alone against emperors, majorities, and councils in defense of Nicene orthodoxy.'},
  {type:'mc',era:'Councils',q:'What does the Greek term "hypostasis" mean in Trinitarian theology?',correct:'Person or individual subsistence',wrong:['Substance or essence shared by the Trinity','The divine will of God','A union of two natures','The eternal generation of the Son','God\'s incomprehensible nature','The relationship between Father and Spirit','The divine energy emanating from God'],explain:'Hypostasis (person/individual subsistence) was the Cappadocians\' key term: the Trinity is one ousia (substance) in three hypostaseis (persons).'},
  {type:'tf',era:'Councils',q:'The Council of Ephesus (431) declared Mary to be the "Mother of God" (Theotokos) primarily to honor Mary herself.',answer:false,explain:'Theotokos was affirmed to protect Christology, not to honor Mary per se — if Christ is truly God, then his mother bore God. It was an argument about who Jesus is, not who Mary is.'},
  {type:'mc',era:'Patristics',q:'What major work did Augustine write responding to the fall of Rome in 410 AD?',correct:'The City of God',wrong:['The Confessions','On the Trinity','Against Faustus','The Enchiridion','On Christian Doctrine','On Free Will','Against Julian'],explain:'Augustine wrote The City of God (413–426) to address pagans who blamed Christianity for Rome\'s fall, arguing history moves toward the heavenly city, not earthly empire.'},
  {type:'tf',era:'Councils',q:'Arius\'s slogan was "There was a time when the Son was not."',answer:true,explain:'This phrase — asserting the Son had a beginning and was therefore not eternal — was the heart of Arianism and the target of the Nicene homoousios formula.'},
  {type:'mc',era:'Patristics',q:'Which church father is often called the "father of Latin theology" for writing the first major theology in Latin?',correct:'Tertullian',wrong:['Augustine','Ambrose','Jerome','Cyprian','Lactantius','Hilary of Poitiers','Leo the Great'],explain:'Tertullian of Carthage was the first major Christian theologian to write primarily in Latin, coining terms that shaped Western theology for centuries.'},
  {type:'mc',era:'Councils',q:'Which council dealt with the Nestorian controversy, condemning the view that Christ\'s two natures implied two persons?',correct:'Council of Ephesus (431)',wrong:['Council of Nicaea (325)','Council of Constantinople (381)','Council of Chalcedon (451)','Council of Trent (1545)','Council of Carthage (397)','Lateran Council (1215)','Council of Constance (1415)'],explain:'Ephesus (431) condemned Nestorius, who seemed to divide Christ into two persons. The council affirmed Mary as Theotokos as a corollary of Christ\'s unified personhood.'},
  {type:'quote',era:'Patristics',quote:'"Our heart is restless until it rests in Thee."',cite:'— Confessions, Book I, c. AD 400',q:'Which church father wrote this opening line in his Confessions?',correct:'Augustine of Hippo',wrong:['Ambrose of Milan','Jerome of Bethlehem','John Chrysostom','Origen of Alexandria','Basil of Caesarea','Gregory of Nazianzus','Tertullian of Carthage'],explain:'Augustine wrote this in the opening paragraph of his Confessions — widely considered one of the most quoted lines in all of Christian literature.'},
  {type:'timeline',era:'Councils',q:'Tap these councils in chronological order, earliest first.',events:[{label:'Nicaea — Son declared homoousios with the Father',year:325},{label:'Constantinople — Spirit\'s full divinity affirmed',year:381},{label:'Augustine begins The City of God',year:413},{label:'Ephesus — Mary declared Theotokos',year:431},{label:'Chalcedon — two natures in one person',year:451}],explain:'Nicaea (325) → Constantinople (381) → City of God begun (413) → Ephesus (431) → Chalcedon (451).'},

function L3_QUESTIONS(){return[
  {type:'mc',era:'Medieval',q:'What were the two main causes of the Great Schism of 1054?',correct:'Disputes over papal authority and the filioque clause',wrong:['A disagreement over the date of Easter and the language of worship','A controversy over icons and priestly celibacy','A dispute over the biblical canon and baptism by immersion','A conflict over monastic rules and the veneration of saints','A political rivalry between the Pope and the Patriarch of Antioch','Disagreement over the nature of purgatory and indulgences','A conflict over which language the Bible should be read in'],explain:'The East-West Schism split Roman Catholicism from Eastern Orthodoxy primarily over papal claims to universal authority and Rome\'s unilateral addition of "filioque" to the Nicene Creed.'},
  {type:'tf',era:'Medieval',q:'The word "filioque" means "and the Son" — added by Rome to say the Spirit proceeds from both Father and Son.',answer:true,explain:'Correct. Rome added "filioque" to the Nicene Creed. The East rejected this as theologically wrong and procedurally illegitimate — Rome had no right to alter the creed unilaterally.'},

  {type:'tf',era:'Medieval',q:'Charlemagne was crowned Holy Roman Emperor by Pope Leo III on Christmas Day, 800 AD.',answer:true,explain:'Correct. This coronation established the pattern of entangled papal and imperial authority that would define medieval Europe — and cause endless conflict between popes and kings.'},

// NAVIGATION
// ═══════════════════════════════════════════
let currentTrack=null;
let currentLessonIdx=null;

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
  document.getElementById('main-scroll').scrollTop=0;
}

function goHome(){
  renderHome();
  showScreen('home');
}

function goTrack(){
  renderTrackDetail(currentTrack);
  showScreen('track');
}

// ═══════════════════════════════════════════
// HOME
// ═══════════════════════════════════════════
function renderHome(){
  const c=document.getElementById('tracks-container');
  c.innerHTML='';
  TRACKS.forEach(tr=>{
    const ts=S.tracks[tr.id]||{lessons:{}};
    const totalLessons=tr.lessons.length;
    const doneLessons=totalLessons===0?0:tr.lessons.filter(l=>(ts.lessons[l.id]||0)>=1).length;
    const steps=totalLessons;
    const doneSteps=doneLessons;
    const pct=steps===0?0:Math.round(doneSteps/steps*100);
    const isLocked=tr.locked||false;
    const isComplete=!isLocked&&pct===100;
    let badgeCls='badge-new',badgeTxt='New';
    if(isLocked){badgeCls='badge-locked';badgeTxt='Locked';}
    else if(isComplete){badgeCls='badge-done';badgeTxt='Complete';}
    else if(doneSteps>0){badgeCls='badge-progress';badgeTxt=doneSteps+'/'+steps+' done';}
    const div=document.createElement('div');
    div.className='track-card'+(isLocked?' locked':'');
    div.innerHTML=`
      <div class="tc-body">
        <div class="tc-icon${isComplete?' complete':''}"><i class="ti ${isComplete?'ti-check':tr.icon}"></i></div>
        <div class="tc-text">
          <div class="tc-name">${tr.name}</div>
          <div class="tc-desc">${tr.desc}</div>
          <div class="tc-pills">${tr.pills.map(p=>`<span class="tc-pill">${p}</span>`).join('')}</div>
        </div>
      </div>
      <div class="tc-footer">
        <span>${tr.eyebrow}</span>
        <div class="tc-progress-track"><div class="tc-progress-fill${isComplete?' done':''}" style="width:${pct}%"></div></div>
        <span class="tc-badge ${badgeCls}">${badgeTxt}</span>
        ${(ts.exam&&ts.exam.passed)?`<span class="wax-seal"><i class="ti ti-award"></i> Passed</span>`:''}
      </div>`;
    if(!isLocked) div.onclick=()=>{currentTrack=tr;renderTrackDetail(tr);showScreen('track');};
    c.appendChild(div);
  });
}

// ═══════════════════════════════════════════
// TRACK DETAIL
// ═══════════════════════════════════════════
function renderTrackDetail(tr){
  document.getElementById('td-eyebrow').textContent=tr.eyebrow;
  document.getElementById('td-title').textContent=tr.name;
  document.getElementById('td-desc').textContent=tr.desc;
  const ts=S.tracks[tr.id]||{lessons:{}};
  const c=document.getElementById('lessons-container');
  c.innerHTML='';

  const eraLabels=['c. AD 30–313','AD 313–451','AD 500–1400','AD 1517–present'];
  const essayTitles=['The Early Church','Constantine & the Councils','The Medieval Church','Reformation & Modern Era'];

  const list=document.createElement('div');
  list.className='tl-list';
  const spine=document.createElement('div');
  spine.className='tl-spine';
  list.appendChild(spine);

  tr.lessons.forEach((les,i)=>{
    const stars=ts.lessons[les.id]||0;
    const lesRead=ts['read_'+les.id]||false;
    const prevDone=i===0?true:(ts.lessons[tr.lessons[i-1].id]||0)>=1;
    const isLocked=!prevDone;
    const isComplete=stars>=1;
    const isActive=!isLocked&&!isComplete;

    const group=document.createElement('div');
    group.className='tl-group';

    const nodeCls=isComplete?'done':isActive?'active':isLocked?'':'upcoming';
    group.innerHTML=`
      <div class="tl-era-row">
        <div class="tl-node ${nodeCls}"></div>
        <span class="tl-era-label">${eraLabels[i]}</span>
      </div>`;

    const cards=document.createElement('div');
    cards.className='tl-cards';

    // Essay card
    const essayDiv=document.createElement('div');
    essayDiv.className='tl-essay'+(isLocked?' locked':'')+(lesRead?' done':'');
    essayDiv.innerHTML=`
      <div class="tl-e-icon${lesRead?' done':''}"><i class="ti ${lesRead?'ti-check':'ti-book-2'}"></i></div>
      <div class="tl-e-info">
        <div class="tl-e-type">Reading</div>
        <div class="tl-e-name">${essayTitles[i]}</div>
        <div class="tl-e-meta">${les.readMeta}</div>
      </div>
      <i class="ti ti-chevron-right" style="font-size:14px;color:var(--ink3);flex-shrink:0;"></i>`;
    if(!isLocked) essayDiv.onclick=()=>openLessonArticle(tr,i);
    cards.appendChild(essayDiv);

    // Quiz card
    const starsHtml=[1,2,3].map(n=>`<i class="ti ti-star tl-star${stars>=n?' lit':''}"></i>`).join('');
    const quizDiv=document.createElement('div');
    quizDiv.className='tl-quiz'+(isLocked?' locked':'')+(isComplete?' complete':'');
    const qIconCls=isComplete?'complete':(isActive&&lesRead)?'active':'';
    quizDiv.innerHTML=`
      <div class="tl-q-icon ${qIconCls}"><i class="ti ${isComplete?'ti-check':isLocked?'ti-lock':'ti-pencil'}"></i></div>
      <div class="tl-q-info">
        <div class="tl-q-type">Quiz</div>
        <div class="tl-q-name">${les.name}</div>
        <div class="tl-q-meta">${les.meta}</div>
      </div>
      <div class="tl-q-right">
        ${isComplete?`<div class="tl-stars">${starsHtml}</div>`:''}
        <i class="ti ti-chevron-right" style="font-size:14px;color:var(--ink3);"></i>
      </div>`;
    if(!isLocked) quizDiv.onclick=()=>startLesson(tr,i);
    cards.appendChild(quizDiv);

    group.appendChild(cards);
    list.appendChild(group);
  });

  c.appendChild(list);

  // Exam CTA — show when all lessons complete
  const allDone=tr.lessons.length>0&&tr.lessons.every(l=>(ts.lessons[l.id]||0)>=1);
  if(allDone){
    const examDiv=document.createElement('div');
    examDiv.className='exam-cta';
    const ex=ts.exam;
    if(ex){
      const starsHtml=[1,2,3].map(i=>`<i class="ti ti-star" style="color:${i<=ex.stars?'var(--gold)':'var(--parch2)'};font-size:18px;margin:0 2px;"></i>`).join('');
      examDiv.innerHTML=`
        <div class="exam-cta-eyebrow">Track Examination</div>
        <div style="margin-bottom:6px;">${starsHtml}</div>
        <p>Best score: ${ex.score}%${ex.passed?' · Passed':' · Not yet passed'}</p>
        <button class="btn btn-primary" onclick="startExam('${tr.id}')"><i class="ti ti-refresh"></i> Retake Examination</button>`;
    } else {
      examDiv.innerHTML=`
        <div class="exam-cta-eyebrow">Track Examination</div>
        <p>You\'ve completed all four lessons. Prove your mastery with the final examination.</p>
        <button class="btn btn-primary" style="background:var(--crimson);border-color:var(--crimson2);" onclick="startExam('${tr.id}')"><i class="ti ti-award"></i> Take the Examination</button>`;
    }
    c.appendChild(examDiv);
  }
}

<p>For the first three centuries, to be Christian was to risk your life. Rome tolerated many religions, but Christians refused to offer incense to the emperor's image — a gesture Rome understood as civic loyalty, not religious devotion. This refusal was read as treason. Christians were accused of atheism, cannibalism, and political sedition.</p>
<p>The persecutions were sporadic, varying by region and emperor. Under <strong>Nero</strong> (64 AD), Christians were blamed for the Great Fire of Rome and executed with theatrical cruelty. <strong>Ignatius of Antioch</strong> wrote seven letters to churches while being transported to Rome for execution. <strong>Polycarp of Smyrna</strong> — a disciple of the Apostle John — refused at eighty-six to curse Christ before the magistrate.</p>

<p>Out of persecution came theology. Thinkers called the Apologists — Justin Martyr, <strong>Tertullian</strong>, Origen — wrote sophisticated defenses of Christianity. Tertullian of Carthage coined the word <em>Trinitas</em> (Trinity) and the formula "one substance, three persons," effectively inventing Western theological vocabulary. His famous line: "The blood of the martyrs is the seed of the church."</p>

<p>In 312 AD, the general <strong>Constantine</strong> reportedly saw a vision before battle and won the empire. The following year, the Edict of Milan legalized Christianity. Within decades it became the official religion of Rome. The church went from persecuted minority to imperial establishment in a single generation.</p>
<p>Constantine convened the <strong>First Council of Nicaea</strong> in 325 AD to resolve the Arian crisis. A priest named <strong>Arius</strong> had been teaching that the Son was a created being — exalted, yes, but not eternal. His slogan: "There was a time when he was not." The council condemned Arius and produced the Nicene Creed, affirming the Son is <em>homoousios</em> — of one substance — with the Father.</p>

<!-- Council of Nicaea -->
<figure class="art-fig">
  <div class="fig-img-wrap" style="min-height:240px;"><img src="https://cdn.jsdelivr.net/gh/daltonp-1689/from_age_to_age@main/images/nicaea.jpg" style="width:100%;max-height:360px;object-fit:cover;display:block;"></div>

<p>The great defender of Nicene orthodoxy was <strong>Athanasius of Alexandria</strong>, who was exiled five times by emperors favoring Arianism. The phrase "Athanasius contra mundum" — Athanasius against the world — captured his lonely courage. He outlasted every emperor who opposed him.</p>
<p>Later councils refined the picture. <strong>Constantinople (381)</strong> affirmed the Holy Spirit's full divinity. <strong>Ephesus (431)</strong> declared Mary Theotokos — God-bearer — affirming the unity of Christ's person. <strong>Chalcedon (451)</strong> defined the hypostatic union: Christ has two complete natures — fully divine, fully human — in one person, without mixture or confusion.</p>

<h3>IV. The Medieval Church (500–1400)</h3>
<p>As the Roman Empire collapsed in the West, the church became the primary institution holding European civilization together. Monasteries preserved literacy, copied manuscripts, and ran the only hospitals in Europe. <strong>Benedict of Nursia</strong> (529) founded Monte Cassino and wrote his Rule, shaping Western monasticism for a thousand years.</p>
<p>The papacy grew in power and ambition. On Christmas Day 800, <strong>Charlemagne</strong> was crowned Holy Roman Emperor by Pope Leo III — cementing the pattern of entangled political and ecclesiastical authority that would define medieval Europe and produce endless conflict between popes and kings.</p>
<p>In 1054, the long-simmering tensions between Rome and Constantinople erupted into the <strong>Great Schism</strong>. The papacy's claim to universal jurisdiction and Rome's unilateral insertion of "filioque" ("and the Son") into the Nicene Creed were the two explosive issues. The two sides exchanged mutual excommunications, dividing Christianity into Roman Catholic and Eastern Orthodox branches that remain separate to this day.</p>

<p>Great thinkers defined this era. <strong>Anselm of Canterbury</strong> (1033–1109) developed the satisfaction theory of atonement. <strong>Thomas Aquinas</strong> (1225–1274) synthesized Aristotelian philosophy with Christian theology in the massive Summa Theologica. Near death, after a mystical experience, he described his entire life's work as "straw."</p>
<p>The era also produced reform movements that anticipated the Reformation. In England, <strong>John Wycliffe</strong> translated the Bible into English and attacked papal authority, influencing the Bohemian priest <strong>Jan Hus</strong>, who was burned at the Council of Constance in 1415 despite a promise of safe conduct — an act of treachery that set Bohemia ablaze.</p>

<h1 class="article-title">Reformation &amp; the Modern Era</h1>
<p class="article-sub">From Luther's 95 Theses to two billion believers worldwide — how the church fractured, revived, and spread to every continent.</p>
<div class="art-divider"></div>
<div class="article-body">

<h3>V. The Reformation (1517–1648)</h3>

<!-- Luther -->
<figure class="art-fig portrait">
  <div class="fig-img-wrap"><img src="https://cdn.jsdelivr.net/gh/daltonp-1689/from_age_to_age@main/images/luther.jpg" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block;"></div>

  </div>
</figure>

<p>On October 31, 1517, an Augustinian monk named <strong>Martin Luther</strong> published 95 theses against the sale of indulgences. The printing press turned what might have been an academic dispute into a continent-wide crisis. Luther was summoned to the Diet of Worms in 1521, where he refused to recant before Emperor Charles V. While in hiding at Wartburg Castle, he translated the New Testament into German.</p>

<!-- Calvin -->
<figure class="art-fig portrait">
  <div class="fig-img-wrap"><img src="https://cdn.jsdelivr.net/gh/daltonp-1689/from_age_to_age@main/images/calvin.png" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block;"></div>
  <div class="fig-body">
    <div class="fig-label">Reformer · 1509–1564</div>
    <div class="fig-title">John Calvin</div>

  </div>

<p>The Reformation fractured quickly into competing streams. <strong>John Calvin</strong> (1509–1564), writing his Institutes at 26, gave Reformed theology its systematic foundation — with doctrines of divine sovereignty, predestination, and covenant that shaped Presbyterians, Congregationalists, and Baptists for centuries. <strong>William Tyndale</strong> translated the New Testament into English in 1526 and was burned in 1536. His dying prayer — "Lord, open the King of England's eyes" — was answered within two years.</p>
<p>The Roman Catholic Church responded with the Council of Trent (1545–1563), reaffirming tradition alongside Scripture, works alongside faith, and seven sacraments. The Westminster Assembly (1643–1649) produced the Westminster Confession of Faith — the definitive statement of Reformed theology, still used by Presbyterians worldwide.</p>

<h3>VI. The Modern Era (1700–Present)</h3>
<p>The eighteenth century brought revival. <strong>George Whitefield</strong> and <strong>John Wesley</strong> led the First Great Awakening, preaching to tens of thousands in open fields across Britain and America. Whitefield's voice, without amplification, could reportedly reach 30,000 listeners at once — a fact Benjamin Franklin verified by calculation.</p>

<!-- Spurgeon -->
<figure class="art-fig portrait">
  <div class="fig-img-wrap"><img src="https://cdn.jsdelivr.net/gh/daltonp-1689/from_age_to_age@main/images/spurgeon.jpg" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block;"></div>
  <div class="fig-body">
    <div class="fig-label">Preacher · 1834–1892</div>
    <div class="fig-title">Charles Spurgeon</div>
    <div class="fig-desc">The "Prince of Preachers" drew 6,000 listeners to London's Metropolitan Tabernacle every Sunday without amplification, and preached to an estimated 10 million people in his lifetime.</div>
  </div>
</figure>

<p>The modern missions movement was born when <strong>William Carey</strong>, a Baptist cobbler, sailed for India in 1793 and spent 41 years translating Scripture into dozens of languages, establishing the pattern for Protestant foreign missions. In the following century, <strong>Charles Spurgeon</strong> — the "Prince of Preachers" — drew 6,000 to London's Metropolitan Tabernacle every Sunday and preached to an estimated 10 million people in his lifetime without a microphone.</p>
<p>The Edinburgh Missionary Conference of 1910 launched the modern ecumenical movement, gathering 1,200 Protestant delegates to coordinate global mission. The Second Vatican Council (1962–65) transformed Roman Catholicism — permitting Mass in local languages, affirming religious liberty, and opening unprecedented dialogue with Protestants and Jews.</p>
<p>Today, Christianity is the world's largest religion, with roughly two billion adherents. Its center of gravity has shifted dramatically southward — the most vibrant growth is now in sub-Saharan Africa, Latin America, and South Korea, not in the declining churches of Western Europe where the story began. The story is far from over.</p>

</div>`;

// LESSON ENGINE
// ═══════════════════════════════════════════
let lessonState=null;

function buildMCOpts(q){
  const wrong=[...q.wrong].sort(()=>Math.random()-0.5).slice(0,3);
  const all=[q.correct,...wrong].sort(()=>Math.random()-0.5);
  return{opts:all,answerIdx:all.indexOf(q.correct)};
}

function startLesson(tr,lessonIdx){
  currentLessonIdx=lessonIdx;
  const les=tr.lessons[lessonIdx];
  const ts=S.tracks[tr.id]||{lessons:{}};
  if(!ts['read_'+les.id]){openLessonArticle(tr,lessonIdx);return;}
  startQuiz(tr,lessonIdx);
}

function startQuiz(tr,lessonIdx){
  currentLessonIdx=lessonIdx;
  const les=tr.lessons[lessonIdx];
  const pool=[...les.questions].sort(()=>Math.random()-0.5).slice(0,8);
  const questions=pool.map(q=>{
    if(q.type==='mc'||q.type==='quote'){
      const{opts,answerIdx}=buildMCOpts(q);
      return{...q,opts,answer:answerIdx};
    }
    if(q.type==='timeline'){
      const shuffled=[...q.events].sort(()=>Math.random()-0.5);
      const sorted=[...q.events].sort((a,b)=>a.year-b.year);
      const order=sorted.map(ev=>shuffled.indexOf(ev));
      return{...q,shuffled,order,timelineStep:0};
    }
    return q;
  });
  lessonState={
    trackId:tr.id,
    lessonId:les.id,
    lessonName:les.name,
    questions,
    qIdx:0,
    lives:3,
    correct:0,
    wrong:0,
    xpEarned:0,
    answered:false,
  };
  renderQuestion();
  showScreen('lesson');
}

function renderQuestion(){
  const ls=lessonState;
  if(ls.qIdx>=ls.questions.length){finishLesson();return;}
  const q=ls.questions[ls.qIdx];
  ls.answered=false;
  const pct=Math.round(ls.qIdx/ls.questions.length*100);

  const heartsHtml=[1,2,3].map(i=>`<span class="heart ${i<=ls.lives?'full':'empty'}" id="heart-${i}"><i class="ti ti-heart${i<=ls.lives?'':'-broken'}" style="font-size:22px;"></i></span>`).join('');

  let qBody='';
  if(q.type==='mc'||q.type==='quote'){
    const quoteBlock=q.type==='quote'?`<div class="pull-quote" style="margin-bottom:1rem;"><p>${q.quote}</p><cite>${q.cite}</cite></div>`:'';
    qBody=quoteBlock+`<div class="options" id="opts-container">`+
      q.opts.map((o,i)=>`<button class="opt" onclick="selectOpt(${i})" id="opt-${i}"><span class="opt-letter">${'ABCD'[i]}</span>${o}</button>`).join('')+
    `</div>`;
  } else if(q.type==='timeline'){
    qBody=`<div id="timeline-container" style="display:flex;flex-direction:column;gap:8px;margin-top:1rem;">`+
      q.shuffled.map((ev,i)=>{
        const isDone=q.order.slice(0,q.timelineStep).includes(i);
        return `<button class="opt${isDone?' tl-done':''}" ${isDone?'disabled':`onclick="selectTimeline(${i})"`} id="tl-opt-${i}"><span class="opt-letter">${isDone?(q.order.indexOf(i)+1):'·'}</span>${ev.label}</button>`;
      }).join('')+
    `</div>`;
  } else {
    qBody=`<div class="tf-row">
      <button class="tf-btn" onclick="selectTF(true)" id="tf-true"><i class="ti ti-check tf-icon"></i><span class="tf-label">True</span></button>
      <button class="tf-btn" onclick="selectTF(false)" id="tf-false"><i class="ti ti-x tf-icon"></i><span class="tf-label">False</span></button>
    </div>`;
  }

  document.getElementById('lesson-inner').innerHTML=`
    <div class="lives-bar">
      <div class="lives-display">${heartsHtml}</div>
      <div class="lesson-prog-wrap">
        <div class="lesson-prog-track"><div class="lesson-prog-fill" style="width:${pct}%"></div></div>
        <div class="lesson-prog-label">${ls.qIdx}/${ls.questions.length}</div>
      </div>
    </div>
    <div class="q-card" id="q-card">
      <div class="q-card-header">
        <span class="q-era">${q.era}</span>
        <span class="q-type-badge">${q.type==='tf'?'True / False':q.type==='timeline'?'Order the timeline':q.type==='quote'?'Quote':'Multiple choice'}</span>
      </div>
      <div class="q-body">
        <div class="q-text">${q.q}</div>
        ${qBody}
      </div>
    </div>
    <div class="q-feedback" id="q-feedback"></div>
    <button class="continue-btn" id="continue-btn" style="display:none;" onclick="nextQ()">
      <i class="ti ti-arrow-right"></i> Continue
    </button>`;
}

function selectOpt(idx){
  if(lessonState.answered) return;
  lessonState.answered=true;
  const q=lessonState.questions[lessonState.qIdx];
  const correct=(idx===q.answer);
  document.querySelectorAll('.opt').forEach(o=>{o.onclick=null;o.style.cursor='default';});
  document.getElementById('opt-'+q.answer).classList.add('correct');
  if(!correct) document.getElementById('opt-'+idx).classList.add('wrong');
  handleResult(correct,q.explain);
}

function selectTF(val){
  if(lessonState.answered) return;
  lessonState.answered=true;
  const q=lessonState.questions[lessonState.qIdx];
  const correct=(val===q.answer);
  const trueBtn=document.getElementById('tf-true');
  const falseBtn=document.getElementById('tf-false');
  if(trueBtn){trueBtn.onclick=null;trueBtn.style.cursor='default';}
  if(falseBtn){falseBtn.onclick=null;falseBtn.style.cursor='default';}
  const chosenBtn=document.getElementById(val?'tf-true':'tf-false');
  const otherBtn=document.getElementById(val?'tf-false':'tf-true');
  if(correct){
    if(chosenBtn) chosenBtn.classList.add('correct');
  } else {
    if(chosenBtn) chosenBtn.classList.add('wrong');
    if(otherBtn) otherBtn.classList.add('correct');
  }
  handleResult(correct,q.explain);
}

function selectTimeline(displayIdx){
  if(lessonState.answered) return;
  const q=lessonState.questions[lessonState.qIdx];
  const expectedIdx=q.order[q.timelineStep];
  if(displayIdx===expectedIdx){
    q.timelineStep++;
    const btn=document.getElementById('tl-opt-'+displayIdx);
    if(btn){btn.classList.add('tl-done');btn.onclick=null;btn.style.cursor='default';const l=btn.querySelector('.opt-letter');if(l)l.textContent=q.timelineStep;}
    if(q.timelineStep===q.events.length){
      lessonState.answered=true;
      lessonState.correct++;
      lessonState.xpEarned+=10;
      addXP(10);
      const fb=document.getElementById('q-feedback');
      fb.className='q-feedback show correct';
      fb.innerHTML='<strong>Correct order!</strong> '+q.explain;
      const cb=document.getElementById('continue-btn');
      if(cb)cb.style.display='flex';
    }
  } else {
    lessonState.wrong++;
    lessonState.lives--;
    q.timelineStep=0;
    const heartEl=document.getElementById('heart-'+(lessonState.lives+1));
    if(heartEl)heartEl.classList.add('lost');
    const wrongBtn=document.getElementById('tl-opt-'+displayIdx);
    if(wrongBtn){wrongBtn.classList.add('shake');setTimeout(()=>wrongBtn.classList.remove('shake'),450);}
    const fb=document.getElementById('q-feedback');
    fb.className='q-feedback show wrong';
    fb.innerHTML='<strong>Wrong order.</strong> Start from the earliest event.';
    if(lessonState.lives<=0){
      setTimeout(()=>showDeathScreen(),1600);
    } else {
      setTimeout(()=>renderQuestion(),900);
    }
  }
}

function handleResult(correct,explain){
  if(correct){
    lessonState.correct++;
    lessonState.xpEarned+=10;
    addXP(10);
  } else {
    lessonState.wrong++;
    lessonState.lives--;
    const heartEl=document.getElementById('heart-'+(lessonState.lives+1));
    if(heartEl) heartEl.classList.add('lost');
    const card=document.getElementById('q-card');
    if(card){card.classList.add('shake');setTimeout(()=>card.classList.remove('shake'),450);}
  }
  const fb=document.getElementById('q-feedback');
  fb.className='q-feedback show '+(correct?'correct':'wrong');
  fb.innerHTML='<strong>'+(correct?'Correct!':'Wrong.')+'</strong> '+explain;
  if(!correct && lessonState.lives<=0){
    setTimeout(()=>showDeathScreen(),1600);
  } else {
    const btn=document.getElementById('continue-btn');
    if(btn) btn.style.display='flex';
  }
}

function nextQ(){
  lessonState.qIdx++;
  renderQuestion();
}

function showDeathScreen(){
  const ls=lessonState;
  document.getElementById('lesson-result-content').innerHTML=`
    <div class="result-icon red"><i class="ti ti-heart-broken"></i></div>
    <div class="result-title">Out of lives!</div>
    <div class="result-sub">You ran out of hearts on <strong>${ls.lessonName}</strong>. Review the reading and try again.</div>
    <div class="result-stats">
      <div class="rst"><div class="n">${ls.correct}</div><div class="l">Correct</div></div>
      <div class="rst"><div class="n">${ls.wrong}</div><div class="l">Wrong</div></div>
    </div>
    <div class="result-btns">
      <button class="btn btn-primary btn-full" onclick="retryLesson()"><i class="ti ti-refresh"></i> Try again</button>
      <button class="btn btn-full" onclick="goTrack()">Back to track</button>
    </div>`;
  showScreen('lesson-result');
}

function retryLesson(){
  startLesson(currentTrack,currentLessonIdx);
}

// ═══════════════════════════════════════════
// EXAM ENGINE
// ═══════════════════════════════════════════
let examState=null;

function startExam(trackId){
  const all=[...L1_QUESTIONS(),...L2_QUESTIONS(),...L3_QUESTIONS(),...L4_QUESTIONS()];
  const shuffledAll=[...all].sort(()=>Math.random()-0.5);
  const picked=shuffledAll.slice(0,20);
  const questions=picked.map(q=>{
    if(q.type==='mc'||q.type==='quote'){
      const{opts,answerIdx}=buildMCOpts(q);
      return{...q,opts,answer:answerIdx};
    }
    if(q.type==='timeline'){
      const shuffled=[...q.events].sort(()=>Math.random()-0.5);
      const sorted=[...q.events].sort((a,b)=>a.year-b.year);
      const order=sorted.map(ev=>shuffled.indexOf(ev));
      return{...q,shuffled,order,timelineStep:0,examWrongCounted:false};
    }
    return{...q};
  });
  examState={trackId,questions,qIdx:0,correct:0,wrong:0};
  renderExamQuestion();
  showScreen('exam');
}

function renderExamQuestion(){
  const es=examState;
  if(es.qIdx>=es.questions.length){finishExam();return;}
  const q=es.questions[es.qIdx];
  const prog=`${es.qIdx+1} / ${es.questions.length}`;

  let qBody='';
  if(q.type==='mc'||q.type==='quote'){
    const quoteBlock=q.type==='quote'?`<div class="pull-quote" style="margin-bottom:1rem;"><p>${q.quote}</p><cite>${q.cite}</cite></div>`:'';
    qBody=quoteBlock+`<div class="options" id="exam-opts-container">`+
      q.opts.map((o,i)=>`<button class="opt" onclick="selectExamOpt(${i})" id="exam-opt-${i}"><span class="opt-letter">${'ABCD'[i]}</span>${o}</button>`).join('')+
    `</div>`;
  } else if(q.type==='tf'){
    qBody=`<div class="options" id="exam-opts-container">
      <button class="opt" onclick="selectExamTF(true)" id="exam-opt-true"><span class="opt-letter">T</span>True</button>
      <button class="opt" onclick="selectExamTF(false)" id="exam-opt-false"><span class="opt-letter">F</span>False</button>
    </div>`;
  } else if(q.type==='timeline'){
    qBody=`<div id="exam-timeline-container" style="display:flex;flex-direction:column;gap:8px;margin-top:1rem;">`+
      q.shuffled.map((ev,i)=>{
        const isDone=q.order.slice(0,q.timelineStep).includes(i);
        return `<button class="opt${isDone?' tl-done':''}" ${isDone?'disabled':`onclick="selectExamTimeline(${i})"`} id="exam-tl-opt-${i}"><span class="opt-letter">${isDone?(q.order.indexOf(i)+1):'·'}</span>${ev.label}</button>`;
      }).join('')+`</div>`;
  }

  const badgeTxt=q.type==='tf'?'True / False':q.type==='timeline'?'Order the timeline':q.type==='quote'?'Quote':'Multiple choice';

  document.getElementById('exam-inner').innerHTML=`
    <div class="exam-seal-bar">
      <div class="exam-eyebrow">Track 1 Examination</div>
      <div class="exam-title">Final Examination</div>
      <div class="exam-prog">${prog}</div>
    </div>
    <div class="q-type-badge">${badgeTxt}</div>
    <div class="q-text">${q.q}</div>
    ${qBody}
    <div class="q-feedback" id="exam-feedback"></div>
    <div class="q-continue" id="exam-continue-btn" style="display:none;">
      <button class="btn btn-primary" onclick="nextExamQ()"><i class="ti ti-arrow-right"></i> Continue</button>
    </div>`;
}

function selectExamOpt(idx){
  const q=examState.questions[examState.qIdx];
  const correct=idx===q.answer;
  document.querySelectorAll('#exam-opts-container .opt').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.answer) b.classList.add('correct');
    else if(i===idx&&!correct) b.classList.add('wrong');
  });
  handleExamResult(correct,q.explain);
}

function selectExamTF(val){
  const q=examState.questions[examState.qIdx];
  const correct=val===q.answer;
  ['true','false'].forEach(v=>{
    const b=document.getElementById('exam-opt-'+v);
    if(b){b.disabled=true;if(String(q.answer)===v) b.classList.add('correct');else if(String(val)===v&&!correct) b.classList.add('wrong');}
  });
  handleExamResult(correct,q.explain);
}

function selectExamTimeline(displayIdx){
  const q=examState.questions[examState.qIdx];
  if(displayIdx===q.order[q.timelineStep]){
    const btn=document.getElementById('exam-tl-opt-'+displayIdx);
    if(btn){btn.disabled=true;btn.classList.add('tl-done');btn.querySelector('.opt-letter').textContent=q.timelineStep+1;}
    q.timelineStep++;
    if(q.timelineStep===q.events.length){
      handleExamResult(true,q.explain);
    }
  } else {
    const btn=document.getElementById('exam-tl-opt-'+displayIdx);
    if(btn){btn.classList.add('wrong');setTimeout(()=>btn.classList.remove('wrong'),600);}
    q.timelineStep=0;
    const fb=document.getElementById('exam-feedback');
    fb.className='q-feedback show wrong';
    fb.innerHTML='<strong>Wrong order</strong> — start over.';
    setTimeout(renderExamQuestion,900);
  }
}

function handleExamResult(correct,explain){
  if(correct) examState.correct++; else examState.wrong++;
  const fb=document.getElementById('exam-feedback');
  fb.className='q-feedback show '+(correct?'correct':'wrong');
  fb.innerHTML='<strong>'+(correct?'Correct!':'Wrong.')+'</strong> '+explain;
  document.getElementById('exam-continue-btn').style.display='flex';
}

function nextExamQ(){
  examState.qIdx++;
  renderExamQuestion();
}

function finishExam(){
  const es=examState;
  const pct=Math.round(es.correct/20*100);
  let stars=0;
  if(pct>=90) stars=3;
  else if(pct>=75) stars=2;
  else if(pct>=60) stars=1;
  const passed=stars>=1;
  if(!S.tracks[es.trackId]) S.tracks[es.trackId]={lessons:{}};
  const prev=S.tracks[es.trackId].exam||{stars:0};
  if(stars>=prev.stars){
    S.tracks[es.trackId].exam={passed,score:pct,stars,takenAt:new Date().toISOString()};
  }
  save();
  const starsHtml=[1,2,3].map(i=>`<i class="ti ${i<=stars?'ti-star-filled':'ti-star'}" style="font-size:28px;color:${i<=stars?'var(--gold)':'var(--parch2)'};margin:0 3px;"></i>`).join('');
  document.getElementById('exam-result-content').innerHTML=`
    <div class="result-icon ${passed?'green':'red'}"><i class="ti ${passed?'ti-award':'ti-heart-broken'}"></i></div>
    <div class="result-title">${passed?'Examination passed!':'Not quite'}</div>
    <div style="margin-bottom:1rem;">${starsHtml}</div>
    <div class="result-sub">${pct}% correct</div>
    <div class="result-stats">
      <div class="rst"><div class="n">${es.correct}</div><div class="l">Correct</div></div>
      <div class="rst"><div class="n">${es.wrong}</div><div class="l">Wrong</div></div>
      <div class="rst"><div class="n">${pct}%</div><div class="l">Score</div></div>
    </div>
    <div class="result-btns">
      ${!passed?`<button class="btn btn-gold btn-full" onclick="startExam('${es.trackId}')"><i class="ti ti-refresh"></i> Retake</button>`:''}
      <button class="btn btn-primary btn-full" onclick="goTrack()"><i class="ti ti-arrow-right"></i> Back to track</button>
    </div>`;
  showScreen('exam-result');
}

function finishLesson(){
  const ls=lessonState;
  const pct=Math.round(ls.correct/ls.questions.length*100);
  let stars=1;
  if(ls.wrong===0) stars=3;
  else if(ls.wrong<=1) stars=2;
  if(!S.tracks[ls.trackId]) S.tracks[ls.trackId]={lessons:{}};
  const prev=S.tracks[ls.trackId].lessons[ls.lessonId]||0;
  S.tracks[ls.trackId].lessons[ls.lessonId]=Math.max(prev,stars);
  if(S.lastStudied!==today()){
    const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);
    S.streak=S.lastStudied===yesterday.toDateString()?(S.streak||0)+1:1;
    S.lastStudied=today();
  }
  save();updateTopbar();

  const starsHtml=[1,2,3].map(i=>`<i class="ti ${i<=stars?'ti-star-filled':'ti-star'}" style="font-size:28px;color:${i<=stars?'var(--gold)':'var(--parch2)'};margin:0 3px;"></i>`).join('');

  document.getElementById('lesson-result-content').innerHTML=`
    <div class="result-icon green"><i class="ti ti-trophy"></i></div>
    <div class="result-title">Lesson complete!</div>
    <div style="margin-bottom:1rem;">${starsHtml}</div>
    <div class="result-sub">${pct}% correct · ${ls.xpEarned} XP earned</div>
    <div class="result-stats">
      <div class="rst"><div class="n">${ls.correct}</div><div class="l">Correct</div></div>
      <div class="rst"><div class="n">${ls.wrong}</div><div class="l">Wrong</div></div>
      <div class="rst"><div class="n">${ls.xpEarned}</div><div class="l">XP</div></div>
    </div>
    <div class="result-btns">
      ${ls.wrong>0?`<button class="btn btn-gold btn-full" onclick="retryLesson()"><i class="ti ti-refresh"></i> Improve score</button>`:''}
      <button class="btn btn-primary btn-full" onclick="goTrack()"><i class="ti ti-arrow-right"></i> Back to track</button>
    </div>`;
  showScreen('lesson-result');
}

// ═══════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════
updateTopbar();
renderHome();
</script>
